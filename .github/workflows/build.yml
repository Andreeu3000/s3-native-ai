name: Build S3-NATIVE-AI Firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  MICROPYTHON_VERSION: v1.27.0
  ESP_IDF_VERSION: v5.5.1
  BOARD: ESP32_S3_N16R8

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget flex bison gperf python3-pip python3-venv \
            cmake ninja-build ccache libffi-dev libssl-dev dfu-util libusb-1.0-0

      - name: Clone MicroPython
        run: |
          git clone --depth 1 --branch ${{ env.MICROPYTHON_VERSION }} https://github.com/micropython/micropython.git
          cd micropython
          git submodule update --init

      - name: Clone and setup ESP-IDF
        run: |
          git clone --depth 1 --branch ${{ env.ESP_IDF_VERSION }} https://github.com/espressif/esp-idf.git
          cd esp-idf
          ./install.sh esp32s3

      - name: Prepare custom board configuration
        run: |
          mkdir -p micropython/ports/esp32/boards/${{ env.BOARD }}
          cp -r boards/${{ env.BOARD }}/* micropython/ports/esp32/boards/${{ env.BOARD }}/
          # Copiamos el archivo de módulos a la carpeta del board para evitar errores de ruta relativa
          cp $GITHUB_WORKSPACE/micropython.cmake micropython/ports/esp32/boards/${{ env.BOARD }}/usermod.cmake

      - name: Build MicroPython firmware
        run: |
          source $GITHUB_WORKSPACE/esp-idf/export.sh
          cd $GITHUB_WORKSPACE/micropython/ports/esp32
          # Usamos la ruta relativa segura desde la carpeta esp32 hacia la carpeta del board
          make BOARD=${{ env.BOARD }} USER_C_MODULES=boards/${{ env.BOARD }}/usermod.cmake clean
          make BOARD=${{ env.BOARD }} USER_C_MODULES=boards/${{ env.BOARD }}/usermod.cmake -j4

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: s3-native-ai-firmware-${{ env.BOARD }}
          path: micropython/ports/esp32/build-${{ env.BOARD }}/firmware.bin
