name: Build S3-NATIVE-AI Firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  # Versiones oficialmente compatibles y estables para el puerto ESP32 de MicroPython
  MICROPYTHON_VERSION: v1.24.0
  ESP_IDF_VERSION: v5.3.2
  BOARD: ESP32_S3_N16R8

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget flex bison gperf python3-pip python3-venv \
            cmake ninja-build ccache libffi-dev libssl-dev dfu-util libusb-1.0-0

      - name: Clone MicroPython
        run: |
          git clone --depth 1 --branch ${{ env.MICROPYTHON_VERSION }} https://github.com/micropython/micropython.git
          cd micropython
          git submodule update --init

      - name: Clone and setup ESP-IDF
        run: |
          git clone --depth 1 --branch ${{ env.ESP_IDF_VERSION }} https://github.com/espressif/esp-idf.git
          cd esp-idf
          ./install.sh esp32s3

      - name: Prepare custom board configuration
        run: |
          mkdir -p micropython/ports/esp32/boards/${{ env.BOARD }}
          cp -r boards/${{ env.BOARD }}/* micropython/ports/esp32/boards/${{ env.BOARD }}/
          # Copiar la tabla de particiones a la raíz del puerto esp32 (requerido por ESP-IDF)
          cp boards/${{ env.BOARD }}/partitions-16MB.csv micropython/ports/esp32/
          # Copiar el archivo cmake a la carpeta del board para referencia de directorio
          cp micropython.cmake micropython/ports/esp32/boards/${{ env.BOARD }}/

      - name: Build MicroPython firmware
        run: |
          source $GITHUB_WORKSPACE/esp-idf/export.sh
          cd $GITHUB_WORKSPACE/micropython/ports/esp32
          # Apuntar USER_C_MODULES al DIRECTORIO del board, como indica la docs oficial de MicroPython
          make BOARD=${{ env.BOARD }} USER_C_MODULES=boards/${{ env.BOARD }} clean
          make BOARD=${{ env.BOARD }} USER_C_MODULES=boards/${{ env.BOARD }} -j4

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: s3-native-ai-firmware-${{ env.BOARD }}
          path: micropython/ports/esp32/build-${{ env.BOARD }}/firmware.bin
