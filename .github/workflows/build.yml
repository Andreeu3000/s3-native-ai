name: Build S3-NATIVE-AI Firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  MICROPYTHON_VERSION: v1.24.0
  ESP_IDF_VERSION: v5.2.2
  BOARD: ESP32_GENERIC_S3
  BOARD_VARIANT: SPIRAM_OCT

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget flex bison gperf python3-pip python3-venv \
            cmake ninja-build ccache libffi-dev libssl-dev dfu-util libusb-1.0-0

      - name: Cache ESP-IDF and Tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.espressif
            ~/esp-idf
          key: esp-idf-${{ env.ESP_IDF_VERSION }}-${{ runner.os }}

      - name: Clone MicroPython
        run: |
          git clone --depth 1 --branch ${{ env.MICROPYTHON_VERSION }} https://github.com/micropython/micropython.git
          cd micropython && git submodule update --init

      - name: Clone and setup ESP-IDF
        run: |
          if [ ! -d "$HOME/esp-idf" ]; then
            git clone --depth 1 --branch ${{ env.ESP_IDF_VERSION }} https://github.com/espressif/esp-idf.git $HOME/esp-idf
            cd $HOME/esp-idf && ./install.sh esp32s3
          else
            echo "ESP-IDF ya está en caché."
            cd $HOME/esp-idf && ./install.sh esp32s3
          fi

      - name: Prepare custom board configuration
        run: |
          cat boards/${{ env.BOARD }}/sdkconfig.board >> micropython/ports/esp32/boards/${{ env.BOARD }}/sdkconfig.board

      - name: Build MicroPython firmware
        run: |
          source $HOME/esp-idf/export.sh
          cd $GITHUB_WORKSPACE/micropython/ports/esp32
          
          make BOARD=${{ env.BOARD }} BOARD_VARIANT=${{ env.BOARD_VARIANT }} clean || true
          rm -rf build-${{ env.BOARD }}-${{ env.BOARD_VARIANT }}
          
          # Inyectamos las macros de TinyUSB vía CFLAGS_EXTRA para toda la compilación
          make BOARD=${{ env.BOARD }} \
               BOARD_VARIANT=${{ env.BOARD_VARIANT }} \
               USER_C_MODULES=${{ github.workspace }}/micropython.cmake \
               CFLAGS_EXTRA="-DCFG_TUD_CDC_EP_BUFSIZE=64 -DCFG_TUD_CDC_RX_BUFSIZE=64 -DCFG_TUD_CDC_TX_BUFSIZE=64" \
               -j$(nproc) > build_output.log 2>&1 || {
            echo "========================================================"
            echo "❌ ERROR DE COMPILACIÓN DETECTADO"
            echo "========================================================"
            tail -n 100 build_output.log
            echo "========================================================"
            echo "FIN DEL LOG"
            echo "========================================================"
            exit 1
          }

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: s3-native-ai-firmware-${{ env.BOARD }}
          path: |
            micropython/ports/esp32/build-${{ env.BOARD }}-${{ env.BOARD_VARIANT }}/firmware.bin
            micropython/ports/esp32/build-${{ env.BOARD }}-${{ env.BOARD_VARIANT }}/bootloader.bin
            micropython/ports/esp32/build-${{ env.BOARD }}-${{ env.BOARD_VARIANT }}/partition-table.bin
