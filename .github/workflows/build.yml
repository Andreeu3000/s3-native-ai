name: Build S3-NATIVE-AI Firmware

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  MICROPYTHON_VERSION: v1.29.0
  ESP_IDF_VERSION: v5.5.2
  BOARD: ESP32_GENERIC_S3
  BOARD_VARIANT: SPIRAM_OCT

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git wget flex bison gperf \
            python3-pip python3-venv \
            cmake ninja-build ccache \
            libffi-dev libssl-dev \
            dfu-util libusb-1.0-0

      - name: Clone MicroPython
        run: |
          git clone \
            --depth 1 \
            --branch "$MICROPYTHON_VERSION" \
            https://github.com/micropython/micropython.git

      - name: Clone and install ESP-IDF
        run: |
          set -euo pipefail

          git clone \
            --depth 1 \
            --branch "$ESP_IDF_VERSION" \
            https://github.com/espressif/esp-idf.git \
            "$HOME/esp-idf"

          git -C "$HOME/esp-idf" submodule update \
            --init --recursive --filter=tree:0

          # ESP-IDF 5.5.2 references this directory in its
          # ESP32-S3 MSPI timing tuning component.
          mkdir -p \
            "$HOME/esp-idf/components/esp_hw_support/mspi_timing_tuning/port/esp32s3/include"

          cd "$HOME/esp-idf"
          ./install.sh esp32s3

      - name: Add native components
        run: |
          set -euo pipefail

          source "$HOME/esp-idf/export.sh"

          cd "$GITHUB_WORKSPACE/micropython/ports/esp32"

          idf.py add-dependency "espressif/esp-dsp==1.7.1"
          idf.py add-dependency "espressif/quirc==1.2.0~1"

      - name: Build firmware
        run: |
          set -euo pipefail

          source "$HOME/esp-idf/export.sh"

          cd "$GITHUB_WORKSPACE/micropython"

          make -C mpy-cross

          cd ports/esp32

          make submodules

          make \
            BOARD="$BOARD" \
            BOARD_VARIANT="$BOARD_VARIANT" \
            USER_C_MODULES="$GITHUB_WORKSPACE/micropython.cmake" \
            -j"$(nproc)" \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Inspect generated module registration
        if: always()
        run: |
          GENHDR="$GITHUB_WORKSPACE/micropython/ports/esp32/build-${BOARD}-${BOARD_VARIANT}/genhdr"

          echo "===== MODULEDEFS ====="
          if [ -f "$GENHDR/moduledefs.h" ]; then
            grep -n -E 's3img|s3qr' "$GENHDR/moduledefs.h" || true
          else
            echo "moduledefs.h no encontrado"
          fi

          echo "===== QSTR DEFINITIONS ====="
          if [ -f "$GENHDR/qstrdefs.generated.h" ]; then
            grep -n -E 's3img|s3qr' "$GENHDR/qstrdefs.generated.h" || true
          else
            echo "qstrdefs.generated.h no encontrado"
          fi

          echo "===== GENERATED FILES ====="
          ls -lh "$GENHDR" || true

      - name: Upload module registration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: module-registration-debug
          path: |
            micropython/ports/esp32/build-${{ env.BOARD }}-${{ env.BOARD_VARIANT }}/genhdr/moduledefs.h
            micropython/ports/esp32/build-${{ env.BOARD }}-${{ env.BOARD_VARIANT }}/genhdr/qstrdefs.generated.h
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload ELF and map debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s3-native-ai-debug-symbols
          path: |
            micropython/ports/esp32/build-${{ env.BOARD }}-${{ env.BOARD_VARIANT }}/firmware.elf
            micropython/ports/esp32/build-${{ env.BOARD }}-${{ env.BOARD_VARIANT }}/*.map
          if-no-files-found: warn

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: s3-native-ai-firmware
          path: micropython/ports/esp32/build-${{ env.BOARD }}-${{ env.BOARD_VARIANT }}/firmware.bin
