name: Build S3-NATIVE-AI Firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  MICROPYTHON_VERSION: v1.24.0
  ESP_IDF_VERSION: v5.2.2
  BOARD: ESP32_S3_N16R8
  BOARD_VARIANT: spiram-oct

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget flex bison gperf python3-pip python3-venv \
            cmake ninja-build ccache libffi-dev libssl-dev dfu-util libusb-1.0-0

      - name: Clone MicroPython
        run: |
          git clone --depth 1 --branch ${{ env.MICROPYTHON_VERSION }} https://github.com/micropython/micropython.git
          cd micropython && git submodule update --init

      - name: Clone and setup ESP-IDF
        run: |
          git clone --depth 1 --branch ${{ env.ESP_IDF_VERSION }} https://github.com/espressif/esp-idf.git
          cd esp-idf && ./install.sh esp32s3

      - name: Prepare custom board configuration
        run: |
          mkdir -p micropython/ports/esp32/boards/${{ env.BOARD }}
          cp -r boards/${{ env.BOARD }}/* micropython/ports/esp32/boards/${{ env.BOARD }}/
          cp boards/${{ env.BOARD }}/partitions-16MB.csv micropython/ports/esp32/

      - name: Build MicroPython firmware
        run: |
          source $GITHUB_WORKSPACE/esp-idf/export.sh
          cd $GITHUB_WORKSPACE/micropython/ports/esp32
          export USER_C_MODULES_FILE=${{ github.workspace }}/micropython.cmake

          make BOARD=${{ env.BOARD }} \
               BOARD_VARIANT=${{ env.BOARD_VARIANT }} \
               USER_C_MODULES=${USER_C_MODULES_FILE} \
               clean || true

          if ! make BOARD=${{ env.BOARD }} \
                    BOARD_VARIANT=${{ env.BOARD_VARIANT }} \
                    USER_C_MODULES=${USER_C_MODULES_FILE} \
                    > build_output.log 2>&1; then
            echo "========================================================"
            echo "ERROR DE COMPILACION DETECTADO"
            echo "========================================================"
            tail -n 80 build_output.log
            echo "========================================================"
            echo "FIN DEL LOG"
            echo "========================================================"
            exit 1
          fi

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: s3-native-ai-firmware-${{ env.BOARD }}
          path: micropython/ports/esp32/build-${{ env.BOARD }}/firmware.bin
